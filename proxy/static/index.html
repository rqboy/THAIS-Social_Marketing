<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THAÏS — Studio LinkedIn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --crimson:#9B1B5A; --crimson-deep:#6E1240; --ink:#2A0E1C; --muted:#6B5A63;
    --surface:#EEF0F2; --paper:#FFFFFF; --line:#D9DCE0; --ok:#1F7A4D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Montserrat,Arial,sans-serif;background:var(--surface);color:var(--ink);font-size:15px;line-height:1.5}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--crimson);outline-offset:2px}

  header{background:var(--crimson);color:#fff;display:flex;align-items:center;gap:18px;padding:14px 28px}
  header img{height:26px}
  header h1{font-size:1rem;font-weight:600;letter-spacing:.01em}
  header .status{margin-left:auto;font-size:.78rem;opacity:.85;text-align:right}

  .app{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 54px)}
  @media(max-width:900px){.app{grid-template-columns:1fr}}

  /* Semaine */
  .rail{background:var(--paper);border-right:1px solid var(--line);padding:22px 18px;display:flex;flex-direction:column;gap:6px}
  .rail h2{font-size:.95rem;font-weight:700;margin-bottom:2px}
  .rail .week-date{font-size:.8rem;color:var(--muted);margin-bottom:14px}
  .slot{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;text-align:left;background:none;border:none;border-radius:6px;padding:10px 8px}
  .slot:hover{background:var(--surface)}
  .slot.on{background:#F6E8EF}
  .slot .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.78rem;font-weight:700;color:var(--muted)}
  .slot.valide .n{background:var(--ok);border-color:var(--ok);color:#fff}
  .slot.on .n{border-color:var(--crimson);color:var(--crimson)}
  .slot.valide.on .n{color:#fff}
  .slot .k{font-size:.74rem;color:var(--muted);font-weight:600}
  .slot .t{font-size:.86rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .slot .t.empty{color:var(--muted);font-weight:500}
  .rail .spacer{flex:1}
  .btn{border:none;border-radius:6px;padding:10px 16px;font-weight:700;font-size:.86rem;background:var(--crimson);color:#fff}
  .btn:hover{background:var(--crimson-deep)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.quiet{background:var(--paper);color:var(--crimson);border:1.5px solid var(--crimson)}
  .btn.quiet:hover{background:#F6E8EF}
  .btn.ok{background:var(--ok)}

  /* Espace de travail */
  main{padding:28px 36px;max-width:1240px}
  .empty-state{max-width:520px;margin:12vh auto;text-align:center}
  .empty-state h2{font-size:1.4rem;margin-bottom:10px}
  .empty-state p{color:var(--muted);margin-bottom:22px}
  .head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .head h2{font-size:1.35rem;font-weight:800}
  .head .cluster{font-size:.86rem;color:var(--muted);font-weight:600}
  .steps{display:flex;gap:6px;margin:10px 0 24px;font-size:.8rem;font-weight:600;color:var(--muted)}
  .steps span{padding:4px 10px;border-radius:20px;background:var(--paper);border:1px solid var(--line)}
  .steps span.done{border-color:var(--ok);color:var(--ok)}
  .steps span.now{border-color:var(--crimson);color:var(--crimson)}

  .angles{display:flex;flex-direction:column;gap:10px;max-width:760px}
  .angle{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:16px 18px}
  .angle:hover{border-color:var(--crimson)}
  .angle b{display:block;font-size:1rem;margin-bottom:4px}
  .angle span{color:var(--muted);font-size:.86rem}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}

  .studio{display:grid;grid-template-columns:minmax(320px,540px) 1fr;gap:28px;align-items:start}
  @media(max-width:1100px){.studio{grid-template-columns:1fr}}
  .visual{background:var(--paper);border-radius:8px;padding:14px;border:1px solid var(--line)}
  .visual .frame{aspect-ratio:1/1;border-radius:4px;overflow:hidden;background:var(--surface)}
  .visual .frame svg{width:100%;height:100%;display:block}
  .tool{display:flex;gap:8px;margin-top:10px}
  .tool input{flex:1;border:1.5px solid var(--line);border-radius:6px;padding:9px 12px;font-size:.84rem;background:var(--paper)}
  .tool input:focus{border-color:var(--crimson);outline:none}
  .tool .btn{padding:9px 14px}
  .text{background:var(--paper);border-radius:8px;padding:14px;border:1px solid var(--line)}
  .text label{font-size:.8rem;font-weight:600;color:var(--muted);display:block;margin-bottom:6px}
  .text textarea{width:100%;min-height:340px;border:1.5px solid var(--line);border-radius:6px;padding:12px;font-size:.88rem;line-height:1.6;resize:vertical}
  .text textarea:focus{border-color:var(--crimson);outline:none}
  .note{font-size:.82rem;color:var(--muted);margin-top:8px}
  .err{background:#FDECEF;border:1px solid #F3C2CF;color:#8A1538;border-radius:6px;padding:10px 12px;font-size:.84rem;margin-top:12px}
  .busy{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.88rem;margin:16px 0}
  .spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--crimson);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
  .validated{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:700;margin-top:16px}
</style>
</head>
<body>
<header>
  <img id="hlogo" alt="THAÏS">
  <h1>Studio LinkedIn</h1>
  <div class="status" id="status">Connexion…</div>
</header>
<div class="app">
  <aside class="rail">
    <h2>Semaine</h2>
    <div class="week-date" id="weekDate"></div>
    <div id="slots"></div>
    <div class="spacer"></div>
    <button class="btn quiet" onclick="newWeek()">Préparer une nouvelle semaine</button>
  </aside>
  <main id="main"></main>
</div>

function measureTextWidth(text, fontSize, weight){
  if(!measureTextWidth._ctx){
    measureTextWidth._ctx = document.createElement('canvas').getContext('2d');
  }
  const ctx = measureTextWidth._ctx;
  ctx.font = `${weight} ${fontSize}px Montserrat, sans-serif`;
  return ctx.measureText(text).width;
}
function wrapToWidth(text, fontSize, weight, maxWidth){
  const words = String(text||'').split(/\s+/).filter(Boolean);
  const lines = []; let cur = '';
  for(const w of words){
    const test = cur ? cur+' '+w : w;
    if(cur && measureTextWidth(test, fontSize, weight) > maxWidth){ lines.push(cur); cur = w; }
    else cur = test;
  }
  if(cur) lines.push(cur);
  return lines.length ? lines : [''];
}
// Prend un texte (ou tableau de lignes) et le fait tenir dans maxWidth x maxLines,
// en réduisant la taille de police si besoin, puis en tronquant en dernier recours.
function fitTextBlock(source, {maxWidth, startSize, minSize=22, maxLines=2, weight=800, step=4}){
  const parts = (Array.isArray(source) ? source : [source]).filter(Boolean);
  const text = parts.join(' ').trim();
  if(!text) return {lines:[], fontSize:startSize};
  let size = startSize, lines;
  do {
    lines = wrapToWidth(text, size, weight, maxWidth);
    if(lines.length <= maxLines || size <= minSize) break;
    size -= step;
  } while(true);
  if(lines.length > maxLines){
    lines = lines.slice(0, maxLines);
    let last = lines[maxLines-1];
    while(last.length > 1 && measureTextWidth(last+'…', size, weight) > maxWidth){ last = last.slice(0,-1).trimEnd(); }
    lines[maxLines-1] = last + '…';
  }
  return {lines, fontSize:size};
}
function textBlockSvg(lines, x, startY, fontSize, opts={}){
  const lh = fontSize * (opts.lineHeightRatio || 1.15);
  const svg = lines.map((l,idx)=>`<text x="${x}" y="${startY+idx*lh}" ${opts.anchor?`text-anchor="${opts.anchor}"`:''} font-family="Montserrat, sans-serif" font-size="${fontSize.toFixed(1)}" font-weight="${opts.weight||800}" fill="${opts.fill||'#ffffff'}" ${opts.opacity!=null?`fill-opacity="${opts.opacity}"`:''} letter-spacing="${opts.spacing!=null?opts.spacing:'-1'}">${esc(l)}</text>`).join('');
  return {svg, height: lines.length*lh};
}
function photoOrFallback(i, href, x, y, w, h){
  if(href) return `<image x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid slice" href="${href}" crossorigin="anonymous"/>`;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#bg${i})"/>`;
}
function defsBase(i){

// ================================================================ API
async function api(path, body){
  const r = await fetch(path, body ? {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)} : {});
  if(!r.ok){ let t = await r.text(); try{ t = JSON.parse(t).detail || t; }catch(e){} throw new Error(`${r.status} — ${String(t).slice(0,240)}`); }
  return r.json();
}
async function claude(system, user, {webSearch=false, maxTokens=1800}={}){
  const d = await api('/api/claude', { system, messages:[{role:'user', content:user}], use_web_search:webSearch, max_tokens: webSearch ? 4000 : maxTokens });
  const texts = (d.content||[]).filter(b=>b.type==='text').map(b=>b.text);
  for(let i=texts.length-1;i>=0;i--){ if(texts[i].includes('{')) return parseJson(texts[i]); }
  throw new Error('Réponse de Claude sans contenu exploitable');
}
function parseJson(t){
  t = t.replace(/```json|```/g,'');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  return JSON.parse(t.slice(a, b+1));
}
async function imagen(prompt){
  const d = await api('/api/imagen', { prompt, aspect_ratio:'1:1' });
  const b64 = d.predictions?.[0]?.bytesBase64Encoded;
  if(!b64) throw new Error("Le générateur d'images n'a renvoyé aucune image");
  return 'data:image/png;base64,' + b64;
}

function mdSection(md, title){
  const re = new RegExp('^##\\s+[^\\n]*'+title+'[^\\n]*\\n([\\s\\S]*?)(?=^##\\s|$(?![\\s\\S]))','mi');
  const m = md.match(re); return m ? m[1] : '';
}
function bulletLines(sec){ return sec.split('\n').map(l=>l.trim()).filter(l=>/^[-*]\s+/.test(l) && !/^[-*]\s+\*\(vide/.test(l)).join('\n'); }
function domainsFrom(sec){
  const out=[]; (sec.match(/https?:\/\/[^\s|)]+/g)||[]).forEach(u=>{ try{ out.push(new URL(u).hostname.replace(/^www\./,'')); }catch(e){} });
  return [...new Set(out)];
}

// ================================================================ semaine
function recentHistory(days){
  const lim = Date.now() - days*86400000;
  return HISTORY.filter(h => new Date(h.date).getTime() >= lim);
}
function planClusters(n=5){
  const counts = {actifs:0, education:0, actualites:0, recrutement:0};
  recentHistory(30).forEach(h => { if(counts[h.cluster]!=null) counts[h.cluster]++; });
  let total = Object.values(counts).reduce((a,b)=>a+b,0);
  const picks = [];
  for(let i=0;i<n;i++){
    let best=null, bestScore=-1e9;
    for(const k of Object.keys(TARGET_MIX)){
      let score = TARGET_MIX[k]*(total+1) - counts[k];
      if(picks[picks.length-1]===k) score -= 0.6;   // évite deux posts identiques à la suite
      if(score>bestScore){ bestScore=score; best=k; }
    }
    picks.push(best); counts[best]++; total++;
  }
  return picks;
}

function assetName(f){ return f.replace(/\.[a-z0-9]+$/i,'').replace(/[-_]+/g,' ').trim(); }
function pickAsset(slot){
  const usedRecently = new Set(recentHistory(60).map(h=>h.asset).filter(Boolean));
  const usedThisWeek = new Set(week.slots.filter(s=>s.id!==slot.id).map(s=>s.assetFile).filter(Boolean));
  const tiers = [
    ASSETS.filter(a=>a.size>=MIN_ASSET_BYTES && !usedRecently.has(a.file) && !usedThisWeek.has(a.file)),
    ASSETS.filter(a=>a.size>=MIN_ASSET_BYTES && !usedThisWeek.has(a.file)),
    ASSETS
  ];
  const pool = tiers.find(t=>t.length) || [];
  return pool.length ? pool[Math.floor(Math.random()*pool.length)].file : '';
}

  let t = `Thématique : ${c.label}\nConsigne : ${c.voice}\nDate du jour : ${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}`;
  if(slot.cluster==='actifs') t += `\nSite imposé (photo disponible) : ${assetName(slot.assetFile)}`;
  if(slot.cluster==='actualites') t += `\nUtilise la recherche web pour trouver UNE actualité marocaine fédératrice récente ou imminente, avec les faits exacts (date, adversaire, lieu).${SOURCES.newsDomains.length?` Sources à privilégier : ${SOURCES.newsDomains.join(', ')}.`:''}`;
  if(slot.cluster==='education' && SOURCES.fmDomains.length) t += `\nPour tout chiffre, vérifie-le par la recherche web, de préférence sur : ${SOURCES.fmDomains.join(', ')}.`;
  if(recent) t += `\n\nDéjà publié sur cette thématique (ne pas refaire) :\n${recent}`;
  if(others) t += `\n\nAutres posts prévus cette semaine (rester distinct) :\n${others}`;
  return t;
}
const useSearch = slot => slot.cluster==='actualites' || (slot.cluster==='education' && SOURCES.fmDomains.length>0);

// ================================================================ étapes
async function run(id, fn){
  busy[id] = true; errors[id] = ''; render();
  try{ await fn(); }catch(e){ errors[id] = e.message; }
  busy[id] = false; save(); render();
}
function proposeAngles(id){
  return run(id, async ()=>{
    await READY;
    const s = slotById(id);
    if(s.cluster==='actifs'){
      if(!ASSETS.length) await loadAssets();
      if(!ASSETS.length) throw new Error("Banque d'images inaccessible : " + (ASSETS_ERR || 'aucune photo trouvée dans le dossier'));
      s.assetFile = pickAsset(s);
    }
    const j = await claude(systemPrompt(), `${contextBlock(s)}

Propose 3 angles éditoriaux nettement différents pour ce post (accroche, point de vue ou format différents). Réponds :
{"angles":[{"angle":"l'idée du post en une phrase","pitch":"pourquoi c'est intéressant pour un décideur, en une phrase"}]}`, {webSearch: useSearch(s)});
    if(!Array.isArray(j.angles) || !j.angles.length) throw new Error('Aucun angle proposé');
    s.angles = j.angles.slice(0,3); s.status = 'angles';
  });
}
function chooseAngle(id, idx){
  return run(id, async ()=>{
    const s = slotById(id);
    s.angle = s.angles[idx];
    await writeContent(s);
    await makeVisual(s);
    s.status = 'redige';
  });
}
async function writeContent(s){
  const imgField = s.cluster==='actifs' ? '' : `, "imagen_prompt":"prompt en anglais pour générer la photo : scène réelle et précise au Maroc (ville, architecture, matériaux, lumière), cadrage photographique explicite, no people, no text, no logos"`;
  const j = await claude(systemPrompt(), `${contextBlock(s)}

Angle retenu : ${s.angle.angle}

Rédige le post. Réponds :
{"eyebrow":"surtitre court lié au sujet (nom du site, concept, chiffre clé) — jamais le nom de la thématique","titre":["ligne 1","ligne 2 facultative"],"sub":["une phrase d'appui"],"tag":"un ou deux mots","copy":"texte complet du post LinkedIn, paragraphes courts, 4-5 hashtags précis à la fin"${imgField}}`, {webSearch: useSearch(s)});
  s.content = { eyebrow:j.eyebrow||'', titre:[].concat(j.titre||[]).filter(Boolean), sub:[].concat(j.sub||[]).filter(Boolean), tag:j.tag||'', copy:j.copy||'' };
  if(j.imagen_prompt) s.imagenPrompt = j.imagen_prompt;
}
async function makeVisual(s){
  if(s.cluster==='actifs') return;
  if(!s.imagenPrompt) throw new Error('Pas de description de photo à générer');
  s.photo = await imagen(s.imagenPrompt);
}
function adjustVisual(id){
  const instr = document.getElementById('adjV').value.trim(); if(!instr) return;
  return run(id, async ()=>{
    const s = slotById(id);
    if(s.cluster==='actifs'){
      const j = await claude('Tu choisis une photo dans une banque. Réponds UNIQUEMENT en JSON : {"file":"nom de fichier EXACT de la liste"}',
        `Photos : ${ASSETS.map(a=>a.file).join(' | ')}\nPhoto actuelle : ${s.assetFile}\nDemande : ${instr}`);
      if(!ASSETS.some(a=>a.file===j.file)) throw new Error(`Aucune photo de la banque ne correspond à « ${j.file} »`);
      s.assetFile = j.file;
    } else if(/mise en page|composition|gabarit|cadrage du texte/i.test(instr)) {
      s.template = TEMPLATE_ORDER[(TEMPLATE_ORDER.indexOf(s.template)+1) % TEMPLATE_ORDER.length];
    } else {
      const j = await claude('Tu révises un prompt de génération de photo selon une demande. Garde : anglais, scène réelle au Maroc, no people, no text, no logos. Réponds UNIQUEMENT en JSON : {"imagen_prompt":"..."}',
        `Prompt actuel : ${s.imagenPrompt}\nDemande : ${instr}`);
      s.imagenPrompt = j.imagen_prompt; s.photo = await imagen(s.imagenPrompt);
    }
  });
}
function adjustText(id){
  const instr = document.getElementById('adjT').value.trim(); if(!instr) return;
  return run(id, async ()=>{
    const s = slotById(id);
    const j = await claude(systemPrompt(), `Post actuel (JSON) : ${JSON.stringify(s.content)}\n\nDemande de modification : ${instr}\n\nRenvoie le post complet modifié, même structure JSON (eyebrow, titre, sub, tag, copy).`);
    s.content = { eyebrow:j.eyebrow||s.content.eyebrow, titre:[].concat(j.titre||s.content.titre), sub:[].concat(j.sub||s.content.sub), tag:j.tag||s.content.tag, copy:j.copy||s.content.copy };
  });
}
function nextLayout(id){ const s=slotById(id); s.template = TEMPLATE_ORDER[(TEMPLATE_ORDER.indexOf(s.template)+1)%TEMPLATE_ORDER.length]; save(); render(); }
function regenPhoto(id){ return run(id, async ()=>{ await makeVisual(slotById(id)); }); }
function validate(id){
  return run(id, async ()=>{
    const s = slotById(id);
    await api('/api/history', { cluster:s.cluster, titre:s.content.titre.join(' '), angle:s.angle?.angle||'', asset:s.assetFile||'', copy:s.content.copy });
    HISTORY.push({ cluster:s.cluster, titre:s.content.titre.join(' '), asset:s.assetFile, date:new Date().toISOString().slice(0,10) });
    s.status = 'valide';
  });
}

// ================================================================ visuels
function slotHref(s){ return s.cluster==='actifs' ? assetUrl(s.assetFile) : s.photo; }
function svgFor(s, href){ return TEMPLATE_FN[s.template]({ ...s, content:s.content }, s.id.replace(/\W/g,''), href ?? slotHref(s)); }

let FONT_CSS = null;
async function embeddedFontCss(){
  if(FONT_CSS) return FONT_CSS;
  const css = await (await fetch('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap')).text();
  const blocks = css.split('/*').filter(b=>/^\s*latin(-ext)?\s*\*\//.test(b));
  let out = '';
  for(const b of blocks){
    const face = b.slice(b.indexOf('@font-face'));
    const url = (face.match(/url\(([^)]+)\)/)||[])[1];
    if(!url) continue;
    out += face.replace(url, await toDataUrl(url));
  }
  return FONT_CSS = out;
}
async function toDataUrl(url){
  const blob = await (await fetch(url)).blob();
  return new Promise(res=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.readAsDataURL(blob); });
}
async function exportPng(id){
  const s = slotById(id);
  try{
    let href = slotHref(s);
    if(href && !href.startsWith('data:')) href = await toDataUrl(href); // une image SVG n'a pas le droit de charger d'URL externe
    let svg = svgFor(s, href);
    const fonts = await embeddedFontCss();
    svg = svg.replace(/<svg([^>]*)>/, `<svg$1><style>${fonts}</style>`);
    const img = new Image();
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=()=>rej(new Error('Rendu du visuel impossible')); img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); });
    const cv = document.createElement('canvas'); cv.width = cv.height = 1080;
    cv.getContext('2d').drawImage(img,0,0,1080,1080);
    const a = document.createElement('a'); a.download = `thais_${s.cluster}_${(s.content.titre[0]||'post').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40)}.png`;
    a.href = cv.toDataURL('image/png'); a.click();
  }catch(e){ errors[id] = 'Export : '+e.message; render(); }
}
function copyText(id, btn){
  navigator.clipboard.writeText(slotById(id).content.copy).then(()=>{ btn.textContent='Texte copié'; setTimeout(()=>btn.textContent='Copier le texte',1800); });
}

// ================================================================ rendu
function render(){
  document.getElementById('weekDate').textContent = week ? 'Préparée le ' + new Date(week.createdAt).toLocaleDateString('fr-FR',{day:'numeric',month:'long'}) : '';
  document.getElementById('slots').innerHTML = !week ? '' : week.slots.map((s,i)=>`
    <button class="slot ${i===selected?'on':''} ${s.status==='valide'?'valide':''}" onclick="selected=${i};save();render()">
      <span class="n">${s.status==='valide'?'✓':i+1}</span>
      <span><span class="k">${CLUSTERS[s.cluster].label}</span><br>
      <span class="t ${s.content?'':'empty'}">${s.content ? esc(s.content.titre.join(' ')) : busy[s.id] ? 'Préparation des angles…' : s.status==='angles' ? 'Angle à choisir' : errors[s.id] ? 'Erreur — à relancer' : 'À préparer'}</span></span>
    </button>`).join('');
  const m = document.getElementById('main');
  if(!week){ m.innerHTML = `<div class="empty-state"><h2>Aucune semaine en cours</h2><p>L'outil répartit 5 posts entre les thématiques selon ce qui a déjà été publié, puis propose 3 angles pour chacun.</p><button class="btn" onclick="newWeek()">Préparer la semaine</button></div>`; return; }
  const s = week.slots[selected];
  const step = s.status==='valide' ? 3 : s.status==='redige' ? 2 : 1;
  const steps = ['Angle','Rédaction','Validé'].map((l,i)=>`<span class="${i+1<step||(step===3&&i===2)?'done':i+1===step?'now':''}">${l}</span>`).join('');
  const err = errors[s.id] ? `<div class="err">${esc(errors[s.id])}</div>` : '';
  const spin = t => `<div class="busy"><div class="spin"></div>${t}</div>`;
  let body = '';
  if(s.status==='vide' || s.status==='angles' && !s.content){
    if(busy[s.id]) body = spin(s.status==='angles' ? 'Rédaction du post et création du visuel…' : 'Recherche de 3 angles…');
    else if(s.angles.length) body = `<div class="angles">${s.angles.map((a,i)=>`<button class="angle" onclick="chooseAngle('${s.id}',${i})"><b>${esc(a.angle)}</b><span>${esc(a.pitch)}</span></button>`).join('')}</div>
      <div class="row"><button class="btn quiet" onclick="proposeAngles('${s.id}')">Proposer d'autres angles</button></div>`;
    else body = `<div class="row"><button class="btn" onclick="proposeAngles('${s.id}')">Proposer 3 angles</button></div>`;
  } else {
    const href = slotHref(s);
    const needPhoto = s.cluster!=='actifs' && !s.photo;
    body = `<div class="studio">
      <div class="visual">
        <div class="frame">${svgFor(s)}</div>
        ${s.status!=='valide' ? `
        <div class="tool"><input id="adjV" placeholder="Modifier le visuel : vue de nuit, plan plus serré${s.cluster==='actifs'?', un autre site…':', ambiance chantier…'}" onkeydown="if(event.key==='Enter')adjustVisual('${s.id}')"><button class="btn" onclick="adjustVisual('${s.id}')" ${busy[s.id]?'disabled':''}>Appliquer</button></div>
        <div class="row"><button class="btn quiet" onclick="nextLayout('${s.id}')">Autre mise en page</button>${needPhoto?`<button class="btn quiet" onclick="regenPhoto('${s.id}')">Générer la photo</button>`:''}</div>` : ''}
        ${needPhoto && !busy[s.id] ? `<div class="note">La photo générée n'est pas conservée après fermeture de l'onglet.</div>` : ''}
      </div>
      <div class="text">
        <label for="copy">Texte du post${s.angle?` — angle : ${esc(s.angle.angle)}`:''}</label>
        <textarea id="copy" ${s.status==='valide'?'readonly':''} oninput="slotById('${s.id}').content.copy=this.value;save()">${esc(s.content.copy)}</textarea>
        ${s.status!=='valide' ? `<div class="tool"><input id="adjT" placeholder="Modifier le texte : plus court, ton plus direct, ajoute un chiffre sourcé…" onkeydown="if(event.key==='Enter')adjustText('${s.id}')"><button class="btn" onclick="adjustText('${s.id}')" ${busy[s.id]?'disabled':''}>Appliquer</button></div>` : ''}
        <div class="row">
          <button class="btn quiet" onclick="copyText('${s.id}',this)">Copier le texte</button>
          <button class="btn quiet" onclick="exportPng('${s.id}')">Télécharger le visuel</button>
          ${s.status==='valide' ? '' : `<button class="btn ok" onclick="validate('${s.id}')" ${busy[s.id]?'disabled':''}>Valider le post</button>`}
        </div>
        ${s.status==='valide' ? `<div class="validated">✓ Validé et ajouté à l'historique</div>` : ''}
        ${s.status!=='valide' ? `<div class="row"><button class="btn quiet" onclick="slotById('${s.id}').content=null;slotById('${s.id}').status='angles';save();render()">Changer d'angle</button></div>` : ''}
      </div>
    </div>${busy[s.id] ? spin('Mise à jour…') : ''}`;
  }
  m.innerHTML = `<div class="head"><h2>Post ${selected+1}</h2><span class="cluster">${CLUSTERS[s.cluster].label}${s.cluster==='actifs'&&s.assetFile?` — ${esc(assetName(s.assetFile))}`:''}</span></div>
    <div class="steps">${steps}</div>${body}${err}`;
}

// ================================================================ démarrage
let READY = (async ()=>{
  document.getElementById('hlogo').src = LOGO_WHITE;
  load(); render();
  const st = [];
  await document.fonts.ready;
  const [a,h] = await Promise.allSettled([api('/api/assets'), api('/api/history'), loadSources()]);
  if(a.status==='fulfilled') ASSETS = a.value; else { ASSETS_ERR = a.reason.message; st.push("banque d'images inaccessible"); }
  if(h.status==='fulfilled') HISTORY = h.value; else st.push('historique inaccessible');
  try{ const hh = await api('/health'); if(!hh.github_token) st.push('GITHUB_TOKEN absent : validation impossible'); }catch(e){}
  document.getElementById('status').textContent = st.length ? st.join(', ')
    : `${ASSETS.length} photos, ${HISTORY.length} posts publiés, ${SOURCES.loaded ? 'sources chargées' : 'sources.md absent'}`;
  render();
})();
async function loadAssets(){ try{ ASSETS = await api('/api/assets'); ASSETS_ERR=''; }catch(e){ ASSETS_ERR = e.message; } }
</script>
